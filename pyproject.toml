[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tds-macro"
version = "1.0.0"
description = "Record and replay Tower Defense Simulator strategies via external input only"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["tds_macro*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"tds_macro/input/win32_defs.py" = ["N801", "E741"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = "build/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
