[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tds-macro"
version = "1.0.0"
description = "Record and replay Tower Defense Simulator strategies via external input only"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["tds_macro*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"tds_macro/input/win32_defs.py" = ["N801", "E741"]

[tool.mypy]
python_version = "3.12"
# This is a Windows application. Without this, typeshed hides the Windows-only
# ctypes attributes (windll, WINFUNCTYPE, get_last_error) that the input layer
# calls behind its own platform guards, and CI on Linux reports them as errors.
platform = "win32"
# The package is checked strictly; the tests are not. Narrowing every `Step` in
# a helper or annotating every fixture catches nothing that running the code
# does not, and the noise hides real findings. (mypy's per-module overrides
# cannot express this: its module patterns wildcard whole name components, not
# prefixes like test_*, and there is no tests/__init__.py to anchor "tests.*".)
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = "^(build|tests)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
