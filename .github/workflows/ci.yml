name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Qt needs these even for the offscreen platform plugin.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglib2.0-0 libxkbcommon0 \
            libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy tds_macro

      # Passes on Linux with the Windows-only checks skipped; it still verifies
      # the ctypes ABI sizes and the coordinate round trip on real geometry.
      - name: Integration check (skips the Windows-only parts)
        run: python tools/win_check.py

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  windows:
    name: Test and build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The same suite as Linux, but here the Win32 modules import for real,
      # which catches a ctypes signature that only breaks on Windows.
      - name: Tests
        run: pytest -q

      # Covers what Linux CI cannot: real ctypes ABI sizes, DPI awareness,
      # monitor geometry, window enumeration, and claiming/releasing a real
      # global hotkey. Sends no input and does not need Roblox.
      - name: Windows integration check
        run: python tools/win_check.py

      - name: Start the GUI and shut it down
        run: python -m tds_macro --self-test 4000 --no-wizard --dry-run --settings-dir "${{ runner.temp }}/tdscfg"

      - name: Build the bundle
        run: python build/build.py

      # Launch the frozen exe itself, not the source. Building was never proof
      # that it runs: the first release built cleanly and died on start-up
      # (a relative import in the entry script, then a missing shiboken6
      # module). It is a GUI-subsystem exe, so PowerShell would return
      # immediately -- Start-Process -Wait makes it block and report the code.
      - name: Launch the built exe
        shell: pwsh
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP "exe-cfg"
          $exe = "build/dist/TDSMacro/TDSMacro.exe"
          $arguments = @("--self-test", "4000", "--no-wizard", "--dry-run", "--settings-dir", $cfg)
          $p = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          Write-Host "TDSMacro.exe exit code: $($p.ExitCode)"
          foreach ($name in @("tds_macro.log", "crash.log")) {
            $path = Join-Path $cfg $name
            if (Test-Path $path) { Write-Host "--- $name ---"; Get-Content $path }
          }
          if ($p.ExitCode -ne 0) { throw "TDSMacro.exe exited with code $($p.ExitCode)" }
          $log = Join-Path $cfg "tds_macro.log"
          if (-not (Test-Path $log)) { throw "the exe never wrote its log" }
          if (-not (Select-String -Path $log -Pattern "controller shut down cleanly" -Quiet)) {
            throw "the exe did not shut down cleanly"
          }

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: TDSMacro-windows
          path: build/dist/*.zip
          if-no-files-found: error
          retention-days: 30
